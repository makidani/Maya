<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya Massage — Addis Ababa</title>
    <meta name="description" content="Premium spa & massage in Addis Ababa.">
    <meta name="theme-color" content="#0f5132">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230f5132'/%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%23c9a227' stroke-width='2'/%3E%3Cpath d='M32 14 C 24 22, 20 28, 32 34 C 44 28, 40 22, 32 14 Z' fill='%23e6c453'/%3E%3Cpath d='M32 34 C 24 42, 20 48, 32 54 C 44 48, 40 42, 32 34 Z' fill='%23fdfaf3'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Poppins:wght@300;400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>

<!-- Language toggle -->
<button id="langToggle" class="lang-toggle" aria-label="Switch language">
    <span class="lang-opt lang-en active">EN</span>
    <span class="lang-opt lang-am">አማ</span>
</button>

<!-- Navbar -->
<header class="navbar" id="navbar">
    <div class="container nav-inner">
        <a href="#home" class="logo">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 64 64" width="38" height="38">
                    <circle cx="32" cy="32" r="30" fill="#0f5132"/>
                    <circle cx="32" cy="32" r="29" fill="none" stroke="#c9a227" stroke-width="2"/>
                    <path d="M32 14 C 24 22, 20 28, 32 34 C 44 28, 40 22, 32 14 Z" fill="#e6c453"/>
                    <path d="M32 34 C 24 42, 20 48, 32 54 C 44 48, 40 42, 32 34 Z" fill="#fdfaf3"/>
                </svg>
            </span>
            <span class="logo-text">
                <span class="en">Maya Massage</span>
                <span class="am">ማያ ማሳጅ</span>
            </span>
        </a>

        <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>

        <nav class="nav-links" id="navLinks">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#team">Team</a>
            <a href="#gallery">Inside</a>
            <a href="#contact">Contact</a>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<!-- ============ FOOTER ============ -->
<footer class="footer">
    <div class="container footer-inner">

        <!-- Brand column -->
        <div class="footer-brand">
            <div class="footer-logo">
                <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
                    <circle cx="32" cy="32" r="30" fill="#0f5132"/>
                    <circle cx="32" cy="32" r="29" fill="none" stroke="#c9a227" stroke-width="2"/>
                    <path d="M32 14 C 24 22, 20 28, 32 34 C 44 28, 40 22, 32 14 Z" fill="#e6c453"/>
                    <path d="M32 34 C 24 42, 20 48, 32 54 C 44 48, 40 42, 32 34 Z" fill="#fdfaf3"/>
                    <path d="M32 18 L32 50" stroke="#0f5132" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
                </svg>
                <div class="footer-logo-text">
                    <span class="footer-logo-en">Maya Massage</span>
                    <span class="footer-logo-am">ማያ ማሳጅ</span>
                </div>
            </div>
            <p class="footer-tagline i18n"
               data-en="Where Your Body Finds Peace."
               data-am="ሰውነትዎ ሰላም የሚያገኝበት ቦታ።">Where Your Body Finds Peace.</p>
        </div>

        <!-- Visit column -->
        <div class="footer-col">
            <h4 class="i18n" data-en="Visit Us" data-am="ይጎብኙን">Visit Us</h4>
            <p class="i18n"
               data-en="{{ biz.address_en }}"
               data-am="{{ biz.address_am }}">{{ biz.address_en }}</p>
            <p class="i18n"
               data-en="{{ biz.hours_en }}"
               data-am="{{ biz.hours_am }}">{{ biz.hours_en }}</p>
        </div>

        <!-- Contact column -->
        <div class="footer-col">
            <h4 class="i18n" data-en="Contact" data-am="አግኙን">Contact</h4>
            <p>📞 <a href="tel:{{ biz.phone_raw }}" class="footer-link">{{ biz.phone_display }}</a></p>
        </div>

    </div>

    <div class="footer-bottom">
        <span>© 2026 Maya Massage &amp; Massage · All rights reserved</span>
    </div>
</footer>

<!-- WhatsApp -->
<a href="https://wa.me/{{ biz.whatsapp }}" class="float-btn whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" width="26" height="26" fill="currentColor">
        <path d="M16 3C9.4 3 4 8.4 4 15c0 2.3.6 4.5 1.8 6.4L4 29l7.8-1.7c1.8 1 3.9 1.5 6 1.5h.1C24.6 28.8 30 23.4 30 16.8 30 10.2 24.6 3 16 3zm0 22.6c-1.9 0-3.7-.5-5.3-1.5l-.4-.2-4.6 1 1-4.5-.3-.4A11.4 11.4 0 0 1 4.6 15C4.6 8.8 9.8 4.4 16 4.4S27.4 8.8 27.4 15c0 6.2-5.1 10.6-11.4 10.6z"/>
    </svg>
</a>

<!-- Call -->
<a href="tel:{{ biz.phone_raw }}" class="float-btn call-float" aria-label="Call">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.3 0 .7-.2 1l-2.3 2.3z"/>
    </svg>
</a>
<!-- Scroll to top button -->
<button id="scrollTop" class="scroll-top" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"/>
    </svg>
</button>
</body>
</html>
